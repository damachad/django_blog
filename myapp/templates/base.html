{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
            content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Blog Website{% endblock %}</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
            crossorigin="anonymous">
        <!-- Static CSS here -->
        <link href="{% static "myapp/styles.css" %}" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <div>
                    <ul class="navbar-nav d-flex flex-row">
                        <li class="nav-item me-2">
                            <a class="nav-link" target="_self" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" target="_self" href="{% url 'addpost' %}">Post</a>
                        </li>
                    </ul>
                </div>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-2">Logged in as 
                        <a href="{% url 'profile_detail' user.pk %}">{{ user.username }}</a>
                        <img src="{{ user.profile_picture.url }}" alt="Profile Picture" 
                            width="20" height="20" class="rounded-circle mx-1">
                        | </span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link text-white p-0">Logout</button>
                    </form>
                    {% else %}
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" target="_self" href="{% url 'login' %}">Login</a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    <div class="container mt-4">
    {% block content %}
    {% endblock %}
    </div>
    <!--  Linked CDN links to support bootstrap functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous">
    </script>
    </body>
</html>
