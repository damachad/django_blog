{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<p>Don't have an account? Create one <a target="_self" href="/register">here</a>!</p>
	<button type="submit" class="btn btn-success">Login</button>
</form>
{% endblock %}
