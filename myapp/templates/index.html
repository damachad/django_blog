{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Django Blog SPA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
            crossorigin="anonymous">
    <!-- Static CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Welcome to the Blog</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <div class="d-flex">
                    <ul class="navbar-nav d-flex flex-row">
                        <li class="nav-item me-2">
                            <a class="nav-link" href="/" id="view-posts" data-link>Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/create_post" id="create-post" data-link>Post</a>
                        </li>
                    </ul>
                </div>
                <div class="d-flex ms-auto">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/login" id="log-in" data-link>Log In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout" id="log-out" data-link>Log Out</a>
                        </li>
                        <li class="nav-item" id="username"></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main id="content"></main>
    <!--  Linked CDN links to support bootstrap functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous">
    </script>
    <!-- Static JS -->
    <script type="module" src="{% static 'js/navigation.js' %}" defer></script>
    <script type="module" src="{% static 'js/router.js' %}" defer></script>
    <script type="module" src="{% static 'js/utils.js' %}" defer></script>
    <script type="module" src="{% static 'js/api.js' %}" defer></script>
    <script type="module" src="{% static 'js/views/home.js' %}" defer></script>
    <script type="module" src="{% static 'js/views/login.js' %}" defer></script>
    <script type="module" src="{% static 'js/views/logout.js' %}" defer></script>
    <script type="module" src="{% static 'js/views/postDetail.js' %}" defer></script>
    <script type="module" src="{% static 'js/views/createPost.js' %}" defer></script>
</body>
</html>
