{% extends 'base.html' %}

{% block content %}
    <h2>Delete Comment</h2>
    <p>Are you sure you want to delete this comment?</p>
    <p><strong>Comment:</strong> {{ object.content }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'postdetail' object.post.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
