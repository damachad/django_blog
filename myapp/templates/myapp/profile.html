{% extends "base.html" %}
{% block title %}{{ object.username }}'s Profile{% endblock %}
{% block content %}
<h2>Your Profile</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
