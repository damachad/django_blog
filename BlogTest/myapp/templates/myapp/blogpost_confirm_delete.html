{% extends "base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}
<h1>Deleting Post</h1>
<form method="post">
	{% csrf_token %}
    <p>Are you sure you want to delete "{{ object }}"?</p>
    {{ form }}
    <input type="submit" value="Confirm">
</form>
</br>
<a href="{% url 'home' %}" 
    target="_self" 
    class="btn btn-primary">Home
</a>
{% endblock %}
