{% extends "base.html" %}
{% block title %}{{ object.title }}{% endblock %}
{% block content %}
    <h1>{{ object.title }}</h1>
    <h3>{{ object.subtitle }}</h3>
</br>
    <p>Date: {{ object.date }}</p>
    <p>Author: {{ object.author }}</p>
    <p>{{ object.body }}</p>
</br>
<a href="{% url 'home' %}" 
    target="_self" 
    class="btn btn-primary">Home
</a>
{% endblock %}
