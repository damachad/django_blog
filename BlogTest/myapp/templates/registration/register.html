{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<p>Already have an account? Login <a target="_self" href="{% url 'login' %}">here</a>!</p>
	<button type="submit" class="btn btn-success">Sign Up</button>
</form>
{% endblock %}
